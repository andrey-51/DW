<section class="section" id="demo">
  <div class="container">
    <div class="cta">
      <div class="cta-grid">
        <div>
          <p class="eyebrow">Book a demo</p>
          <h2>Let's talk about your growth</h2>
          <p class="lead">Book a platform demo and get a dedicated manager who supports you at every stage of the project, starting with the demo.</p>
          <ul class="contact-list">
            <li><svg class="icon"><use href="#i-call"/></svg><div><small>Phone</small><a href="tel:+74952568990">+7&nbsp;495&nbsp;256&#8209;89&#8209;90</a></div></li>
            <li><svg class="icon"><use href="#i-mail"/></svg><div><small>Email</small><a href="mailto:info@datawave.ru">info@datawave.ru</a></div></li>
            <li><svg class="icon"><use href="#i-pin"/></svg><div><small>Office</small><span>26 Malaya Bronnaya St., Bldg. 2, Moscow, Russia</span></div></li>
          </ul>
        </div>
        <form class="form" data-demo-form data-endpoint="" action="mailto:info@datawave.ru" method="post" enctype="text/plain">
          <div class="field">
            <label for="demo-name">Name</label>
            <input id="demo-name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="demo-company">Company</label>
            <input id="demo-company" name="company" type="text" autocomplete="organization">
          </div>
          <div class="field">
            <label for="demo-email">Work email</label>
            <input id="demo-email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="demo-phone">Phone</label>
            <input id="demo-phone" name="phone" type="tel" autocomplete="tel">
          </div>
          <div class="field field-full">
            <label for="demo-message">What would you like to achieve?</label>
            <textarea id="demo-message" name="message" rows="3"></textarea>
          </div>
          <label class="consent">
            <input type="checkbox" name="consent" required>
            <span>I agree to the processing of my personal data for the purpose of handling this request.</span>
          </label>
          <button class="btn btn-primary" type="submit">Book a demo</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </div>
</section>
